name: Render FixReach Promo
on:
  push:
    branches: [feat/fixreach-promo-video]
    paths:
      - 'fixreach-promo/**'
      - '.github/workflows/render-fixreach-video.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fixreach-promo-render
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: fixreach-promo
    steps:
      - name: Checkout feature branch only
        uses: actions/checkout@v4
        with:
          ref: feat/fixreach-promo-video
      - name: Install lightweight system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg libcairo2-dev libpango1.0-dev pkg-config python3-dev build-essential
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Manim without TeX distribution
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'manim==0.19.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Remotion dependencies
        run: npm install --no-audit --no-fund
      - name: Render Manim visuals
        run: python scripts/render_manim.py
      - name: Render 1080x1920 30fps base visuals
        run: npm run build
      - name: Verify base video
        run: |
          test -s out/base_visuals.mp4
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height,r_frame_rate -show_entries format=duration -of json out/base_visuals.mp4
      - name: Publish base visuals to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: fixreach-v1-render
          name: FixReach v1 Base Visual Render
          body: |
            Visual-only 1080x1920 30fps base render.
            Voiceover, music, and subtitles are intentionally processed separately.
          files: fixreach-promo/out/base_visuals.mp4
          fail_on_unmatched_files: true
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
