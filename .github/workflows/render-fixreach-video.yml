name: Render FixReach Promo v3
on:
  push:
    branches: [feat/fixreach-promo-video]
    paths:
      - 'fixreach-promo/**'
      - '.github/workflows/render-fixreach-video.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fixreach-promo-render
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/fixreach-promo-video
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: fixreach-promo/package.json
      - name: Install media verification tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Prepare render directories
        run: mkdir -p fixreach-promo/out fixreach-promo/public/sfx fixreach-promo/public/assets
      - name: Install Remotion dependencies
        working-directory: fixreach-promo
        run: npm install --no-audit --no-fund
      - name: TypeScript preflight
        working-directory: fixreach-promo
        run: npm run typecheck
      - name: Generate original UI sound effects
        working-directory: fixreach-promo
        run: node scripts/generate-sfx.js
      - name: Render visual master
        working-directory: fixreach-promo
        run: npm run build
      - name: Export six scene midpoint stills
        working-directory: fixreach-promo
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p fixreach-promo/out/keyframes
          for spec in '01:210' '02:705' '03:1307' '04:1878' '05:2343' '06:2737'; do
            name="${spec%%:*}"; frame="${spec##*:}"
            npx remotion still src/index.ts FixReachPromo "out/keyframes/scene_${name}.png" --frame="${frame}" --image-format=png
          done
      - name: Verify render and keyframes
        working-directory: fixreach-promo
        run: |
          test -s out/base_visuals.mp4
          test "$(find out/keyframes -maxdepth 1 -name 'scene_*.png' | wc -l)" -eq 6
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height,r_frame_rate -show_entries format=duration -of json out/base_visuals.mp4
      - name: Publish v3 master and keyframes
        uses: softprops/action-gh-release@v2
        with:
          tag_name: fixreach-v1-render
          name: FixReach v3 Visual Master
          body: |
            Visual-only master 1080x1920 at 30fps, plus six scene midpoint PNGs.
            Voiceover, music and subtitles are mixed separately.
          files: |
            fixreach-promo/out/base_visuals.mp4
            fixreach-promo/out/keyframes/*.png
          fail_on_unmatched_files: true
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
