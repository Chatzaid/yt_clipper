name: FixReach Stage 1 — visuals + Python SFX
on:
  push:
    branches: [feat/fixreach-promo-video]
    paths: ['fixreach-promo/**', '.github/workflows/render-fixreach-video.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fixreach-stage1-render
  cancel-in-progress: false
jobs:
  render-stage-1:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/fixreach-promo-video
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install native render dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libcairo2-dev libpango1.0-dev pkg-config python3-dev
      - name: Install Manim and Python SFX dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "manim==0.19.0" "numpy<2.3" "scipy==1.15.3"
      - name: Render Manim scene assets
        working-directory: fixreach-promo
        run: python scripts/render_manim.py
      - name: Generate original Python SFX
        working-directory: fixreach-promo
        run: python scripts/generate_sfx.py
      - name: Install Remotion dependencies
        working-directory: fixreach-promo
        run: npm install --no-audit --no-fund
      - name: TypeScript preflight
        working-directory: fixreach-promo
        run: npm run typecheck
      - name: Render visual composition
        working-directory: fixreach-promo
        run: npm run build
      - name: Strip every audio stream from Stage 1 visuals
        working-directory: fixreach-promo
        run: ffmpeg -y -i out/base_visuals.mp4 -map 0:v:0 -an -c:v copy -movflags +faststart out/visuals.mp4
      - name: Assemble synced SFX WAV (no VO or BGM)
        working-directory: fixreach-promo
        run: python scripts/mix_sfx.py
      - name: Export six scene midpoint stills
        working-directory: fixreach-promo
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/keyframes
          for spec in '01:125' '02:420' '03:779' '04:1119' '05:1395' '06:1630'; do
            name="${spec%%:*}"; frame="${spec##*:}"
            npx remotion still src/index.ts FixReachPromo "out/keyframes/scene_${name}.png" --frame="${frame}" --image-format=png
          done
      - name: Verify Stage 1 deliverables
        working-directory: fixreach-promo
        shell: bash
        run: |
          set -euo pipefail
          test -s out/visuals.mp4 && test -s out/sfx.wav
          test "$(find out/keyframes -maxdepth 1 -name 'scene_*.png' | wc -l)" -eq 6
          ffprobe -v error -show_streams -show_format -of json out/visuals.mp4 > out/visuals_probe.json
          ffprobe -v error -show_streams -show_format -of json out/sfx.wav > out/sfx_probe.json
          python scripts/verify_stage1.py
          ffmpeg -v error -i out/visuals.mp4 -f null -
      - name: Upload Stage 1 review bundle
        uses: actions/upload-artifact@v4
        with:
          name: fixreach-stage1-visuals-sfx
          path: |
            fixreach-promo/out/visuals.mp4
            fixreach-promo/out/sfx.wav
            fixreach-promo/out/keyframes/*.png
            fixreach-promo/out/*_probe.json
            fixreach-promo/public/manim/*.mp4
          if-no-files-found: error
          retention-days: 14
